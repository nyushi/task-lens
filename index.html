<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks / Work overview</title>
<style>
:root{font-family:system-ui,sans-serif;color:#28313b;background:#f7f8fa}*{box-sizing:border-box}body{max-width:960px;margin:auto;padding:40px 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.02em}#mode{font-size:11px;color:#8a929b}#status{font-size:12px;color:#9a672e;margin-bottom:16px}#status:empty{display:none}nav{display:flex;gap:5px;align-items:center;margin-bottom:22px}button,input{font:inherit;font-size:12px;border:0;background:transparent;color:#7b838c;padding:8px 11px;border-radius:5px}button{cursor:pointer}button.active{color:#26323e;background:#e9edf1}input{margin-left:auto;border:1px solid #e1e5e9;background:#fff;width:190px}#cards{display:flex;flex-direction:column;gap:20px}article{background:white;border:1px solid #e4e7eb;border-radius:8px;padding:28px 32px}h2{font-size:16px;font-weight:650;margin:0 0 8px}.purpose{font-size:14px;color:#626e7b;margin:0 0 26px}.purpose-label{color:#9aa2aa;margin-right:10px;font-size:11px}.tree,.tree ul{list-style:none;padding:0;margin:0}.tree ul{margin-left:8px;padding-left:25px;border-left:1px solid #e3e8ed}.tree li{position:relative;padding:3px 0}.tree ul>li:before{content:'';position:absolute;left:-25px;top:20px;width:16px;border-top:1px solid #e3e8ed}.node{display:flex;align-items:flex-start;gap:10px;padding:7px 0;line-height:1.6}.icon{width:17px;flex-shrink:0;color:#a2aab3;font-size:13px}.done .icon{color:#9aaca2}.done .title{color:#737e88}.doing .title{color:#263b4b}.todo .title{color:#89939e}.current .title{font-weight:600}.current .icon{color:#3e7d83}.title{font-size:13px}.tags{margin-left:auto;display:flex;gap:12px;white-space:nowrap;align-items:center;font-size:11px;padding-top:2px}.current-label{color:#699196}.attention{color:#a77836}.attention.review{color:#8575a4}.detail{font-size:12px;color:#8a929b;margin-top:3px}.empty-tree{font-size:13px;color:#8a929b;margin:20px 0;line-height:1.7}.card-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-top:14px;border-top:1px solid #f0f2f4;font-size:10px;color:#a0a7af}details{font-size:11px;color:#929ca6;max-width:80%}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#8a929b}details p{font-size:11px}.warning{font-size:12px;color:#aa773a}.empty{padding:30px;color:#8a929b}@media(max-width:600px){body{padding:24px 16px}header{margin-bottom:20px}article{padding:22px 18px}nav{flex-wrap:wrap}input{width:100%;margin:8px 0 0}.tags{gap:6px}.tree ul{padding-left:17px}.tree ul>li:before{left:-17px;width:10px}.title{font-size:12px}}
.heading{display:flex;justify-content:space-between;gap:12px}.category{font-size:11px;color:#83909b}.node{position:relative}.branch-toggle{position:absolute;left:-21px;top:6px;padding:2px 4px;font-size:12px;color:#8b98a3}.tree ul .branch-toggle{background:white}.title{overflow-wrap:anywhere}#history{max-width:none;margin-top:24px}#history>summary{padding:12px 0}#history-cards{display:flex;flex-direction:column;gap:20px;margin-top:10px}
/* Clear hierarchy without additional panels or badges. */
article{padding:28px 32px 22px}.heading{align-items:baseline;margin-bottom:14px}h2{font-size:13px;font-weight:600;color:#667482;margin:0}.category{font-size:11px;color:#768593}.purpose{font-size:21px;line-height:1.5;font-weight:650;letter-spacing:-.02em;color:#263745;margin:0 0 28px}.purpose-label{display:block;font-size:10px;font-weight:500;letter-spacing:.05em;color:#8b97a2;margin:0 0 6px}.tree{padding-top:18px;border-top:1px solid #edf0f3}.tree ul{padding-top:0;border-top:0;margin-top:2px;margin-bottom:5px}.node{padding:9px 0}.title{font-size:14px;line-height:1.65}.done .title{color:#6e7c88}.todo .title{color:#8c98a3}.doing .title{color:#354b5a}.current .title{font-weight:650;color:#225b62}.current>.icon{color:#347d84}.current-label{font-size:11px;font-weight:600;color:#347d84}.attention{font-size:11px;color:#9c6a25}.detail{font-size:12px;line-height:1.6}.branch-toggle{top:9px}.tree ul>li:before{top:25px}.card-bottom{margin-top:20px;padding-top:15px}.empty-tree{border-top:1px solid #edf0f3;padding-top:20px;margin-top:0}
@media(max-width:600px){article{padding:24px 20px 18px}.purpose{font-size:19px;margin-bottom:23px}.title{font-size:13px}.heading{margin-bottom:12px}.tags{gap:7px}.node{gap:8px}}

.flow{padding-top:18px;border-top:1px solid #edf0f3}
.node.current{background:#edf5f4;border-radius:6px;box-shadow:0 0 0 6px #edf5f4}
.node.current>.icon{background:transparent}
.tree .node.current .branch-toggle{background:transparent}
.future-unknown{font-size:12px;color:#8c98a3;margin:20px 0 0 30px}

/* One connector system for every depth: left trunk and horizontal branch.
   End each sibling trunk at its final node, never through a task row. */
.flow{padding-left:33px}
.tree ul{margin-left:0;padding-left:33px;border-left:0}
.tree li,.flow>li{margin-left:0;padding:3px 0;border-left:0}
.tree li::before,.flow>li::before{content:'';position:absolute;left:-25px;top:25px;width:16px;border-top:1px solid #e3e8ed}
.tree li::after{content:'';position:absolute;left:-25px;top:0;bottom:0;border-left:1px solid #e3e8ed;pointer-events:none}
.tree li:last-child::after{bottom:auto;height:25px}
@media(max-width:600px){.flow,.tree ul{padding-left:25px}.tree li::before,.flow>li::before{left:-17px;width:10px}.tree li::after{left:-17px}}
</style><header><h1>Tasks</h1><span id="mode"></span></header><div id="status"></div><nav><button data-filter="all" class="active">すべて</button><button data-filter="action">対応が必要</button><button data-filter="delegated">おまかせ中</button><button data-filter="unknown">状態不明</button><input id="search" placeholder="検索" aria-label="タスク・作業を検索"></nav><main id="cards"></main><details id="history"><summary>完了履歴</summary><div id="history-cards"></div></details>
<script>
let data=null,filter='all';const expanded=new Set();const collapsed=new Set();const $=s=>document.querySelector(s);const labels={decision:'判断待ち',review:'レビュー待ち',none:'対応不要',unknown:'未判定'};function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}function date(t){return t?new Date(t*1000).toLocaleTimeString('ja-JP'):'未更新'}
function category(t,seen=new Set()){if(seen.has(t.id))return 'unknown';seen.add(t.id);if(['decision','review'].includes(t.attention)||taskNeedsAction(t.tree,seen))return 'action';if(t.stale||!data.connected)return 'unknown';if(t.state==='done'&&t.attention==='none')return 'completed';if(['doing','todo'].includes(t.state)&&t.attention==='none')return 'delegated';return 'unknown'}
function taskNeedsAction(nodes,seen=new Set()){return nodes.some(n=>['decision','review'].includes(n.attention)||taskNeedsAction(n.children||[],seen)||(n.content.kind==='task'&&!seen.has(n.content.taskId)&&data.tasks[n.content.taskId]&&category(data.tasks[n.content.taskId],new Set(seen))==='action'))}
function needsAction(nodes){return nodes.some(n=>['decision','review'].includes(n.attention)||needsAction(n.children||[]))}
function treeView(nodes,taskId,path='',top=false,ancestors=new Set(),depth=0){
 const ul=el('ul','','tree'+(top?' flow':''));
 if(depth>24){ul.append(el('li','深い階層の表示を省略'));return ul}
 for(const n of nodes){
  const key=path+'/'+taskId+'/'+n.id, ref=n.content.kind==='task'?data.tasks[n.content.taskId]:null;
  const title=ref?.purpose||n.content.text||'参照先が見つかりません';
  const state=ref?.state||n.state,attention=ref?.attention||n.attention;const li=el('li',''),row=el('div','','node '+state+(n.current?' current':''));row.dataset.nodeId=n.id;
  if(n.current)row.setAttribute('aria-current','step');
  const icon=el('span',({done:'✓',doing:'●',todo:'○',unknown:'?'})[state]||'?','icon');
  icon.setAttribute('aria-label',({done:'完了',doing:'進行中',todo:'未着手',unknown:'不明'})[state]);row.append(icon);
  const body=el('div','');body.append(el('div',title,'title'));if(n.detail&&!['あなたの判断待ち','判断待ち','レビュー待ち'].includes(n.detail))body.append(el('div',n.detail,'detail'));if(ref)body.append(el('div','タスク','detail'));row.append(body);
  const tags=el('div','','tags');if(n.current)tags.append(el('span','現在','current-label'));
  const children=n.children||[];const embedded=ref?.tree||[];
  if(['decision','review'].includes(attention)&&!taskNeedsAction([...children,...embedded]))tags.append(el('span',labels[attention],'attention '+attention));row.append(tags);li.append(row);
  if(children.length||ref){const toggle=el('button',collapsed.has(key)?'▸':'▾','branch-toggle');toggle.setAttribute('aria-label',title+'の枝');toggle.setAttribute('aria-expanded',String(!collapsed.has(key)));toggle.onclick=()=>{collapsed.has(key)?collapsed.delete(key):collapsed.add(key);render()};row.prepend(toggle);
   if(!collapsed.has(key)){if(ref){if(ancestors.has(ref.id))li.append(el('p','循環参照のため表示を停止','warning'));else li.append(treeView(embedded,ref.id,key,false,new Set([...ancestors,ref.id]),depth+1))}if(children.length)li.append(treeView(children,taskId,key,false,ancestors,depth+1))}
   else if(taskNeedsAction([...children,...embedded]))tags.append(el('span','対応待ちあり','attention'));
  }ul.append(li);
 }return ul;
}
function evidenceFor(t,seen=new Set()){if(seen.has(t.id))return [];seen.add(t.id);const refs=new Set();function walk(nodes){for(const n of nodes){for(const id of n.sourceRefs||[])refs.add(id);walk(n.children||[]);if(n.content.kind==='task'&&data.tasks[n.content.taskId])for(const id of evidenceFor(data.tasks[n.content.taskId],seen))refs.add(id)}}walk(t.tree);return [...refs]}
function render(){if(!data?.tasks)return;$('#mode').textContent=data.mode;$('#status').textContent=data.error||(!data.connected?'切断中 · 表示は過去の情報です':(data.usage&&Object.keys(data.usage.held).length?`変換保留 ${Object.keys(data.usage.held).length}件 · 呼出 ${data.usage.calls}回`:''));$('#status').title=data.usage?Object.values(data.usage.held).join(' · '):'';const cards=$('#cards'),history=$('#history-cards');cards.replaceChildren();history.replaceChildren();const q=$('#search').value.toLowerCase();
 const tasks=data.roots.map(id=>data.tasks[id]).filter(Boolean).filter(t=>(filter==='all'||category(t)===filter)&&JSON.stringify(t).toLowerCase().includes(q)).sort((a,b)=>({action:0,delegated:1,unknown:2,completed:3}[category(a)])-({action:0,delegated:1,unknown:2,completed:3}[category(b)]));
 $('#history').hidden=filter!=='all';let complete=0;
 for(const t of tasks){const a=el('article','');a.dataset.taskId=t.id;const h=el('div','','heading');h.append(el('span',({action:'対応が必要',delegated:'おまかせ中',unknown:'状態不明',completed:'完了'})[category(t)],'category'));a.append(h);const purpose=el('p','','purpose');purpose.append(el('span','目的','purpose-label'),el('span',t.purpose));a.append(purpose);
 if(t.stale)a.append(el('p','更新待ち · 過去の情報です','warning'));
 a.append(t.tree.length?treeView(t.tree,t.id,'',true,new Set([t.id])):el('p','作業の流れは未確認','empty-tree'));
 const bottom=el('div','','card-bottom'),d=el('details','');d.open=expanded.has(t.id);d.ontoggle=()=>d.open?expanded.add(t.id):expanded.delete(t.id);d.append(el('summary','根拠'));for(const id of evidenceFor(t)){const source=data.sources[id];d.append(el('pre',source?.content||'根拠未取得'));if(source?.coverage?.complete===false)d.append(el('p','取得範囲に欠落あり'))}bottom.append(d,el('span','更新 '+date(t.updatedAt)));a.append(bottom);
 if(category(t)==='completed'){history.append(a);complete++}else cards.append(a);
 }$('#history > summary').textContent='完了履歴 · '+complete;if(!tasks.length)cards.append(el('div','該当するタスクがありません','empty'));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').oninput=render;async function poll(){try{const r=await fetch('state',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();render()}catch{$('#status').textContent='接続が切れました。表示は過去の情報です';$('#status').className='warning'}setTimeout(poll,3000)}poll();
</script></html>
